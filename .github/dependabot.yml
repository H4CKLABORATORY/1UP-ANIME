version: 2
updates:
  - package-ecosystem: npm
    directory: "/integrations/jkanime-v2"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
