name: 1UP Anime1v live Render check
on:
  workflow_dispatch:
  push:
    branches: [feature/anime1v-metadata-runtime-20261017]
    paths:
      - 'scripts/check-anime1v-live.mjs'
      - '.github/workflows/anime1v-live-check.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-anime1v-live.mjs
