name: 1UP Auth security
on:
  pull_request:
  push:
    branches: [main, feature/1up-auth]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/oneup-auth.test.mjs
      - run: node --check auth.js && node --check oneup-auth-client.js
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f tests/oneup-auth.sql
        env:
          PGPASSWORD: local-ci-only
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/oneup-auth-browser.mjs
