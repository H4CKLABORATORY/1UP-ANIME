name: Refresh anime airing calendar
on:
  workflow_dispatch:
  schedule:
    - cron: "11 3,9,15,21 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh-airing.mjs"
      - ".github/workflows/refresh-airing.yml"
permissions:
  contents: write
concurrency:
  group: oneup-airing-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch factual airing times and seasonal trailers from AniList
        run: node scripts/refresh-airing.mjs
      - name: Publish schedule to site data
        run: bash scripts/oneup-safe-push.sh 'Update live anime airing calendar' data/airing.json
