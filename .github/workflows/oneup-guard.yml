name: ONEUP Self Healing
on:
  workflow_dispatch:
    inputs:
      offline_only:
        description: Validar únicamente archivos internos
        type: boolean
        default: false
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/oneup-guard.mjs"
      - ".github/workflows/oneup-guard.yml"
      - "scripts/check-guard.mjs"
      - "scripts/guard-alert.mjs"
permissions:
  contents: write
  issues: write
concurrency:
  group: oneup-self-healing
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate health engine and existing UI
        run: |
          node --check scripts/oneup-guard.mjs
          node scripts/check-ui.mjs
      - name: Archive pre-checkpoint state
        uses: actions/upload-artifact@v4
        with:
          name: oneup-before-guard-${{ github.run_number }}
          retention-days: 21
          if-no-files-found: error
          path: |
            index.html
            sw.js
            studio.js
            data/catalog.json
            data/airing.json
            data/translations-es.json
            data/dexter/records.json
            data/dexter/history.json
            config/dexter-providers.json
            data/licensed-media.json
            data/external-providers.json
      - name: Probe data and public Pages with bounded retries
        env:
          OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline_only || false }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$OFFLINE" = "true" ]; then
            node scripts/oneup-guard.mjs --offline
          else
            node scripts/oneup-guard.mjs
          fi
      - name: Validate guard report
        run: node scripts/check-guard.mjs
      - name: Upload health report and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneup-health-${{ github.run_number }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            data/guard/status.json
            data/guard/history.json
      - name: Publish monitoring report
        run: bash scripts/oneup-safe-push.sh 'ONEUP health snapshot (no application changes)' data/guard/status.json data/guard/history.json
      - name: Open one issue for persistent incidents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/guard-alert.mjs
