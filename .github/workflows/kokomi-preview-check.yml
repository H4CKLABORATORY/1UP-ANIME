name: ONEUP Kokomi Visual Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'episode-player.js'
      - 'hls-adapter.js'
      - 'player.css'
      - 'preview-kokomi-mobile.html'
      - 'themes/kokomi-mobile-preview/**'
      - 'scripts/e2e-kokomi-preview.mjs'
      - 'scripts/e2e-editorial-pro.mjs'
      - 'scripts/e2e-player-languages.mjs'
      - 'scripts/test-episode-player.mjs'
      - '.github/workflows/kokomi-preview-check.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify script syntax
        run: |
          node --check themes/kokomi-mobile-preview/theme.js
          node --check themes/kokomi-mobile-preview/pages.js
          node --check themes/kokomi-mobile-preview/watch-comments.js
          node --check scripts/e2e-kokomi-preview.mjs
          node --check scripts/e2e-editorial-pro.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser checks and screenshots
        run: |
          node scripts/test-episode-player.mjs
          node scripts/test-media-source-contract.mjs
          node scripts/check-hls-browser.mjs
          node scripts/e2e-player-languages.mjs
          node scripts/e2e-kokomi-preview.mjs
          node scripts/e2e-editorial-pro.mjs
          node scripts/e2e-browser.mjs
      - name: Store screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokomi-1up-browser-evidence
          path: e2e-*.png
          retention-days: 14
          if-no-files-found: ignore
