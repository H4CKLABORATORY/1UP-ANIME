name: ONEUP Official Watch Links
on:
  pull_request:
    paths:
      - 'official-watch.*'
      - 'airing-ui.js'
      - 'index.html'
      - 'scripts/refresh-airing.mjs'
      - 'sw.js'
      - 'tests/official-watch.test.mjs'
      - '.github/workflows/official-watch-check.yml'
  push:
    paths:
      - 'official-watch.*'
      - 'airing-ui.js'
      - 'index.html'
      - 'scripts/refresh-airing.mjs'
      - 'sw.js'
      - 'tests/official-watch.test.mjs'
permissions:
  contents: read
jobs:
  official-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis de módulos
        run: |
          node --check official-watch.js
          node --check airing-ui.js
          node --check scripts/refresh-airing.mjs
      - name: Probar enlaces externos y rutas
        run: node --test tests/official-watch.test.mjs
