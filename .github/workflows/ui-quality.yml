name: One Up UI Quality
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "studio.js"
      - "spotlight.css"
      - "player.css"
      - "brand-v2.css"
      - "assets/oneup-crest.svg"
      - "data/translations-es.json"
      - "data/licensed-media.json"
      - "scripts/video_a_subtitulos.py"
      - "sw.js"
      - "data/catalog.json"
      - "scripts/check-ui.mjs"
      - "airing-ui.js"
      - "airing-ui.css"
      - "community.js"
      - "community.css"
      - "comunidad.html"
      - "episode-comments.js"
      - "episode-comments.css"
      - "social-backend.js"
      - "social-config.js"
      - "functions/index.js"
      - "firestore.rules"
      - "storage.rules"
      - "data/airing.json"
      - "motor.html"
      - "motor.js"
      - "motor.css"
      - "moderacion.html"
      - "moderacion.js"
      - "scripts/oneup-guard.mjs"
      - "scripts/check-guard.mjs"
      - "scripts/check-resilience.mjs"
      - "scripts/guard-alert.mjs"
      - "docs/ONEUP_SELF_HEALING.md"
      - ".github/workflows/oneup-guard.yml"
      - ".github/workflows/oneup-revert-proposal.yml"
      - ".github/dependabot.yml"
      - ".github/workflows/ui-quality.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate UI and cached anime data
        run: |
          node scripts/check-ui.mjs
          node scripts/check-resilience.mjs
          node --check scripts/oneup-guard.mjs
          node --check scripts/guard-alert.mjs
          node scripts/oneup-guard.mjs --offline --strict
          node scripts/check-guard.mjs
