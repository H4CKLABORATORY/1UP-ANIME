name: One Up UI Quality
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "studio.js"
      - "spotlight.css"
      - "player.css"
      - "brand-v2.css"
      - "assets/oneup-crest.svg"
      - "data/translations-es.json"
      - "data/licensed-media.json"
      - "scripts/video_a_subtitulos.py"
      - "sw.js"
      - "data/catalog.json"
      - "scripts/check-ui.mjs"
      - "airing-ui.js"
      - "airing-ui.css"
      - "community.js"
      - "community.css"
      - "comunidad.html"
      - "episode-comments.js"
      - "episode-comments.css"
      - "social-backend.js"
      - "social-config.js"
      - "functions/index.js"
      - "firestore.rules"
      - "storage.rules"
      - "data/airing.json"
      - ".github/workflows/ui-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate UI and cached anime data
        run: node scripts/check-ui.mjs
