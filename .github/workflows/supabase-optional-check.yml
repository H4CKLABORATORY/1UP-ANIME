name: ONEUP optional Supabase verification
on:
  pull_request:
    paths:
      - "server/supabase/sql/oneup_community_optional.sql"
      - "client/src/js/supabase-config.js"
      - "client/src/js/supabase-episode-backend.js"
      - "client/src/js/episode-comments.js"
      - "scripts/check-supabase-option.mjs"
      - ".github/workflows/supabase-optional-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify frontend syntax
        run: |
          node --check client/src/js/supabase-config.js
          node --check client/src/js/supabase-episode-backend.js
          node --check client/src/js/episode-comments.js
      - name: Verify optional Supabase backend without network or secrets
        run: node scripts/check-supabase-option.mjs
