name: ONEUP Browser Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/e2e-browser.mjs"
      - "scripts/e2e-franchise.mjs"
      - ".github/workflows/browser-acceptance.yml"
      - "index.html"
      - "themes/oneup-palette/**"
      - "scripts/e2e-oneup-palette.mjs"
      - "themes/oneup-motion/**"
      - "scripts/e2e-oneup-motion.mjs"
      - "comunidad.html"
      - "moderacion.html"
      - "studio.js"
      - "community.js"
      - "airing-ui.js"
      - "motor.js"
      - "external-providers.js"
      - "external-providers.css"
      - "data/external-providers.json"
      - "sw.js"
      - "brand-v2.css"
      - "preview-october.html"
      - "themes/october-2026/**"
      - "preview-kokomi.html"
      - "themes/kokomi-studio/**"
      - "spotlight.css"
      - "player.css"
      - "community.css"
  pull_request:
    branches: [main]
concurrency:
  group: oneup-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated test runner
        run: npm install --no-audit --no-fund --ignore-scripts && npm ls playwright @playwright/test
      - name: Install Chromium and required OS libraries
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run real iPhone-width and desktop user journeys
        run: |
          node scripts/test-episode-comments.mjs
          node scripts/e2e-player-languages.mjs
          node scripts/e2e-browser.mjs
          node scripts/e2e-franchise.mjs
          node scripts/e2e-oneup-palette.mjs
          node --check themes/oneup-motion/windows.js
          node --check scripts/e2e-oneup-motion.mjs
          node scripts/e2e-oneup-motion.mjs
      - name: Keep browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneup-browser-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: e2e-*.png
