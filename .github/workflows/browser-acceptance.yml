name: ONEUP Browser Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/e2e/e2e-browser.mjs"
      - "tests/e2e/e2e-franchise.mjs"
      - ".github/workflows/browser-acceptance.yml"
      - "client/index.html"
      - "client/themes/oneup-palette/**"
      - "tests/e2e/e2e-oneup-palette.mjs"
      - "client/themes/oneup-motion/**"
      - "tests/e2e/e2e-oneup-motion.mjs"
      - "client/pages/comunidad.html"
      - "client/pages/moderacion.html"
      - "client/src/js/studio.js"
      - "client/src/js/community.js"
      - "client/src/js/airing-ui.js"
      - "client/src/js/motor.js"
      - "client/src/js/external-providers.js"
      - "client/src/styles/external-providers.css"
      - "data/external-providers.json"
      - "client/sw.js"
      - "client/src/styles/brand-v2.css"
      - "client/pages/preview-october.html"
      - "client/themes/october-2026/**"
      - "client/pages/preview-kokomi.html"
      - "client/themes/kokomi-studio/**"
      - "client/src/styles/spotlight.css"
      - "client/src/styles/player.css"
      - "client/src/styles/community.css"
  pull_request:
    branches: [main]
concurrency:
  group: oneup-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated test runner
        run: npm install --no-audit --no-fund --ignore-scripts && npm ls playwright @playwright/test
      - name: Install Chromium and required OS libraries
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run real iPhone-width and desktop user journeys
        run: |
          node tests/e2e/test-episode-comments.mjs
          node tests/e2e/e2e-player-languages.mjs
          node tests/e2e/e2e-browser.mjs
          node tests/e2e/e2e-franchise.mjs
          node tests/e2e/e2e-oneup-palette.mjs
          node --check client/themes/oneup-motion/windows.js
          node --check tests/e2e/e2e-oneup-motion.mjs
          node tests/e2e/e2e-oneup-motion.mjs
      - name: Keep browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oneup-browser-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: e2e-*.png
