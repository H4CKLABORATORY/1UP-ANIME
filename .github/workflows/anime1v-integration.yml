name: Anime1v metadata integration check
on:
  pull_request:
    branches: [main]
    paths:
      - 'render/anime1v-adapter.js'
      - 'anime1v-discovery.js'
      - 'anime1v-discovery.css'
      - 'data/anime1v-config.json'
      - 'scripts/test-anime1v-integration.mjs'
      - '.github/workflows/anime1v-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
# Added in the Phase 7 audit: this was the only audited workflow with no
# concurrency group. Cancelling a superseded run of this read-only check
# does not change what it verifies.
concurrency:
  group: anime1v-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check render/anime1v-adapter.js
          node --check anime1v-discovery.js
          node --check scripts/test-anime1v-integration.mjs
      - name: Adapter unit tests
        run: node scripts/test-anime1v-integration.mjs
      - name: Existing player regression
        run: |
          node scripts/test-episode-player.mjs
          node scripts/test-media-source-contract.mjs
