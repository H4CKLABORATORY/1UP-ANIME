name: Refresh public anime catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    paths:
      - "scripts/refresh-catalog.mjs"
      - "scripts/translate-catalog.py"
      - "data/sinopsis-editoriales-es.json"
      - ".github/workflows/refresh-catalog.yml"
permissions:
  contents: write
concurrency:
  group: oneup-catalog-snapshot
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch anime catalog from AniList
        run: node scripts/refresh-catalog.mjs
      - name: Setup Python for offline Spanish translation
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install open source translation engine
        run: python -m pip install --disable-pip-version-check "argostranslate>=1.9,<2"
      - name: Translate cached synopsis to Spanish
        run: python scripts/translate-catalog.py
      - name: Commit refreshed static catalog and translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/translations-es.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh anime catalog and automatic Spanish synopses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
