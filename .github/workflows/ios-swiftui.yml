name: ONEUP Native iPhone Build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-swiftui.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-swiftui.yml"
permissions:
  contents: read
jobs:
  swiftui:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native app with owner resources
        run: bash ios/scripts/prepare.sh
      - name: Validate real iPhone simulator build, without credentials
        run: |
          cd ios
          xcodebuild -project OneUpAnime.xcodeproj -scheme OneUpAnime -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee /tmp/oneup-ios-build.log
          grep -F 'BUILD SUCCEEDED' /tmp/oneup-ios-build.log
