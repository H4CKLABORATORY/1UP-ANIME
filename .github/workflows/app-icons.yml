name: Generate ONE UP app icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/oneup-crest.svg"
      - "scripts/build-icons.py"
      - ".github/workflows/app-icons.yml"
permissions:
  contents: write
concurrency:
  group: oneup-app-icons
  cancel-in-progress: true
jobs:
  icons:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render branded PNG icons
        run: python scripts/build-icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-180.png assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Update iPhone and PWA icons from original 1UP crest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
