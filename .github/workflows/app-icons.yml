name: Generate ONE UP app icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/oneup-crest.svg"
      - "scripts/build-icons.py"
      - ".github/workflows/app-icons.yml"
permissions:
  contents: write
concurrency:
  group: oneup-app-icons
  cancel-in-progress: true
jobs:
  icons:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render branded PNG icons
        run: python scripts/build-icons.py
      - name: Commit generated icons
        run: bash scripts/oneup-safe-push.sh 'Update iPhone and PWA icons from original 1UP crest' assets/icon-180.png assets/icon-192.png assets/icon-512.png
