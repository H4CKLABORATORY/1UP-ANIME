name: ONEUP Cinematic V3 Preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'client/pages/preview-cinematic-v3.html'
      - 'client/themes/cinematic-v3/**'
      - 'tests/e2e/e2e-cinematic-v3.mjs'
      - '.github/workflows/cinematic-v3-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and source media is present
        run: |
          node --check client/themes/cinematic-v3/studio.js
          node --check tests/e2e/e2e-cinematic-v3.mjs
          test -s client/assets/oneup-header-letters.png
          test -s client/assets/1up-anime-intro-firma-3seg.mp4
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify independent layers / iPhone / desktop / reduced motion
        run: node tests/e2e/e2e-cinematic-v3.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-v3-preview-evidence
          path: e2e-cinematic-v3-*.png
          retention-days: 14
          if-no-files-found: ignore
