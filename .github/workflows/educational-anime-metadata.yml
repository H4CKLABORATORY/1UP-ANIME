name: Educational Anime Metadata Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public metadata
        run: python scripts/scrape-anime-metadata.py
      - name: Commit updated data
        run: |
          if ! git diff --quiet -- data/scraped-anime.json || [ -n "$(git ls-files --others --exclude-standard data/scraped-anime.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scraped-anime.json
            git commit -m "data: refresh anime season metadata"
            git push
          fi
