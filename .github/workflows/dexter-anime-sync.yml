name: Dexter Anime Sync
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar actualización de todos los proveedores"
        type: boolean
        default: true
  schedule:
    - cron: "31 2,5,8,11,14,17,20,23 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/dexter-anime-sync.mjs"
      - "config/dexter-providers.json"
      - "data/licensed-media.json"
      - "data/external-providers.json"
      - ".github/workflows/dexter-anime-sync.yml"
permissions:
  contents: write
concurrency:
  group: dexter-anime-sync-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate node and run authorized data adapters
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          node --check scripts/dexter-anime-sync.mjs
          if [ "$FORCE" = "true" ]; then
            node scripts/dexter-anime-sync.mjs --force
          else
            node scripts/dexter-anime-sync.mjs
          fi
      - name: Publish normalized data, history and provider status
        run: bash scripts/oneup-safe-push.sh 'Sync authorized anime episode metadata and source statuses' data/dexter
