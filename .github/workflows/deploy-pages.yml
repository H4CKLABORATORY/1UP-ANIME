name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test gate (lint + unit + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        run: pip install beautifulsoup4

      - name: Install dependencies
        run: npm ci

      # Phase 7 fix (order only; same steps, same triggers): browsers are
      # installed BEFORE the unit tests because two script suites inside
      # `npm test` launch a Playwright headless shell directly and fail
      # on a fresh runner when the executable is not installed yet.
      # Proven by CI run 42423927652 (2026-11-07) on feature/phase7-infra;
      # the corrected sequence is the one ci.yml runs green. This gate
      # itself was NOT dispatched in Phase 7 (static verification only).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Lint
        run: npm run lint

      - name: Unit + script tests
        run: npm test

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Browser tests (Puppeteer)
        run: npm run test:puppeteer

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
