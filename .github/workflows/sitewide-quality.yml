name: ONEUP Sitewide Quality
on:
  pull_request:
    paths:
      - 'client/index.html'
      - 'client/pages/studio.html'
      - 'client/pages/comunidad.html'
      - 'client/pages/motor.html'
      - 'client/pages/moderacion.html'
      - 'client/pages/gremio.html'
      - 'client/src/js/auth.js'
      - 'client/src/styles/ui-quality.css'
      - 'client/assets/oneup-crest-mark.svg'
      - 'client/src/js/depth-toggle-button.js'
      - 'client/sw.js'
      - 'tests/e2e/site-quality.spec.js'
      - '.github/workflows/sitewide-quality.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/styles/ui-quality.css'
      - 'client/src/js/auth.js'
      - 'client/src/js/depth-toggle-button.js'
      - 'tests/e2e/site-quality.spec.js'
      - '.github/workflows/sitewide-quality.yml'
permissions:
  contents: read
jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check client/src/js/auth.js
          node --check client/src/js/depth-toggle-button.js
          node --check tests/e2e/site-quality.spec.js
          node scripts/check-ui.mjs
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify mobile and desktop site UX
        run: npx playwright test tests/e2e/site-quality.spec.js --workers=2
      - name: Upload browser screenshots when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneup-sitewide-quality-review
          path: |
            qa-*.png
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
