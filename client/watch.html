<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a11"><title>Anime | 1UP Anime</title>
<link rel="icon" href="./assets/1up-anime-app-icon-512.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles/player.css"><link rel="stylesheet" href="./src/styles/player-pro.css"><link rel="stylesheet" href="./src/styles/otaku-details.css">
<style>
:root{color-scheme:dark;--bg:#090a11;--panel:#111722;--line:#263344;--green:#18d99a;--muted:#aab6c5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#164b48 0,transparent 38%),var(--bg);color:#f5f7fb;font-family:Outfit, sans-serif;min-height:100vh}
header{height:76px;border-bottom:1px solid #ffffff18;background:#090a11d9;display:flex;align-items:center;padding:0 clamp(18px,5vw,72px);gap:24px;position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}
.brand{display:inline-flex;align-items:center;text-decoration:none}.brand-logo{height:38px;width:auto;display:block}.back{margin-left:auto;border:1px solid var(--line);background:#141d29;color:white;border-radius:12px;padding:10px 16px;text-decoration:none;font-weight:700}
main{max-width:1180px;margin:auto;padding:34px clamp(16px,4vw,48px) 80px}
.hero{position:relative;min-height:390px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(90deg,#090a11 10%,#090a11e8 48%,#090a1166),var(--banner) center/cover}
.hero-inner{display:grid;grid-template-columns:210px 1fr;gap:32px;align-items:end;padding:42px;min-height:390px}
.poster{width:100%;max-height:300px;object-fit:cover;border-radius:16px;box-shadow:0 18px 60px #0009;background:#17212d}
.kicker{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--green);display:flex;align-items:center;gap:8px}.kicker-logo{height:15px;width:auto;display:block}h1{font:900 clamp(34px,5vw,62px)/.98 'Barlow Condensed';margin:12px 0 18px}.meta{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 18px}.meta span,.tag{border:1px solid #ffffff28;background:#111a25c9;border-radius:999px;padding:7px 11px;font-size:12px;color:#e0e8ef}.synopsis{max-width:720px;color:#d1d9e3;line-height:1.75;font-size:15px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.action{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:12px;text-decoration:none;font-weight:800;background:var(--green);color:#06150f;border:0}.action.secondary{background:#162231;color:white;border:1px solid var(--line)}
.section{margin-top:30px;padding:26px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#121b28,#0d121b)}h2{font:800 26px 'Barlow Condensed';letter-spacing:.7px;margin:0 0 12px}.muted{color:var(--muted);line-height:1.65}.providers{display:flex;flex-wrap:wrap;gap:10px}.providers a{color:#bfffe8;text-decoration:none;border:1px solid #1b7459;background:#0e3028;padding:11px 14px;border-radius:12px;font-weight:700}.status{padding:18px;border:1px dashed #526174;border-radius:14px;color:#c2ceda;line-height:1.6}
.trailer-thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:16px;overflow:hidden;cursor:pointer;background:#000;padding:0}
.trailer-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.trailer-play{position:absolute;inset:0;display:grid;place-items:center}
.trailer-play span{display:grid;place-items:center;width:74px;height:74px;border-radius:50%;background:#090a11b8;border:1px solid #c6fb43;color:#c6fb43;font-size:26px;backdrop-filter:blur(4px)}
.trailer-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;display:block;background:#000}
#oneup-player-section{margin-top:30px}
@media(max-width:650px){header{height:64px}.hero-inner{grid-template-columns:105px 1fr;gap:17px;padding:20px;min-height:340px}.poster{max-height:180px}.synopsis{font-size:14px}.section{padding:19px}.hero{min-height:340px}}
</style>
<link rel="stylesheet" href="./src/styles/theme-pro.css">
</head>
<body>
<header><a class="brand" href="./index.html" aria-label="1UP Anime, inicio"><img class="brand-logo" src="./assets/oneup-header-letters.png" alt="1UP ANIME"></a><a class="back" href="./index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg> Volver al catálogo</a></header>
<main>
<section class="hero" id="hero">
 <div class="hero-inner"><img id="poster" class="poster" alt="Póster del anime">
  <div><div class="kicker"><img class="kicker-logo" src="./assets/oneup-header-letters.png" alt="1UP ANIME"> / FICHA DEL ANIME <span class="jp-chip">アニメ</span></div><h1 id="title">Cargando anime…</h1><div id="meta" class="meta"></div><p id="synopsis" class="synopsis">Estamos consultando la información del anime.</p><div class="actions"><a id="official" class="action" href="#" target="_blank" rel="noopener noreferrer" hidden>Ficha oficial <svg class="ext-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9.2 9.2M19.2 13.5V19a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 19V7a1.6 1.6 0 0 1 1.6-1.6H11"/></svg></a><a class="action secondary" href="./index.html">Seguir explorando</a></div></div>
 </div>
</section>
<section class="section" id="trailer-section" hidden><h2>TRÁILER OFICIAL</h2><div id="trailer"></div></section>
<section class="section"><h2>DÓNDE VERLO <span class="jp-chip">配信</span></h2><div id="providers" class="providers"><div class="status">Cargando plataformas…</div></div></section>
<section id="oneup-player-section" hidden></section>
<section class="section"><h2>DETALLES</h2><div id="details" class="muted">Cargando información…</div></section>
</main>
<script src="./src/js/episode-player.js"></script>
<script src="./src/js/watch-page.js"></script><script src="./src/js/progress.js"></script><script src="./src/js/otaku-details.js"></script>
</body></html>
