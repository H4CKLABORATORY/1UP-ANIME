<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a11">
  <title>1UP Anime — Catálogo, Streaming y Descargas</title>
  <link rel="icon" href="../assets/oneup-mascot.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a11;
      --bg-surface: #121520;
      --bg-card: #181d2c;
      --primary: #38bdf8;
      --accent: #ec4899;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, sans-serif;
      line-height: 1.5;
      padding-bottom: 60px;
    }
    header {
      background: rgba(18, 21, 32, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 20px;
    }
    .header-wrap {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
    }
    .brand-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .brand-text span { color: var(--primary); }
    .status-badge {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Filters */
    .search-box {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: #fff;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 1rem;
      margin-bottom: 14px;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }
    .pills-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .pill-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .pill-btn.active, .pill-btn:hover {
      background: var(--primary);
      color: #090a11;
      font-weight: 700;
      border-color: var(--primary);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .poster-wrap {
      position: relative;
      aspect-ratio: 2 / 2.9;
      background: #0f121b;
    }
    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-meta {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }
    .btn-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .modal-hero {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .modal-hero { flex-direction: column; align-items: center; text-align: center; }
    }
    .modal-poster {
      width: 140px;
      aspect-ratio: 2 / 2.9;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .modal-synopsis {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .ep-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      margin: 14px 0;
    }
    .ep-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .ep-btn.active {
      background: var(--primary);
      color: #090a11;
      font-weight: 700;
    }
    .player-box {
      background: #090c13;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 14px;
    }
    .iframe-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0;
    }
    .iframe-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .btn-cta {
      display: inline-block;
      background: var(--primary);
      color: #090a11;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-wrap">
      <a href="../index.html" class="brand">
        <img src="../assets/oneup-mascot.svg" class="brand-logo" alt="1UP">
        <div class="brand-text">1UP <span>CATÁLOGO &amp; STREAMING</span></div>
      </a>
      <div id="apiStatus" class="status-badge">Verificando Micro-API (:4050)...</div>
    </div>
  </header>

  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="Buscar en más de 4,800 animes... (ej. Naruto, Frieren, Bleach)">

    <div class="pills-group">
      <button class="pill-btn active" data-status="all">Todos</button>
      <button class="pill-btn" data-status="airing">🟢 En emisión</button>
      <button class="pill-btn" data-status="finished">Finalizados</button>
    </div>

    <div id="summary" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Cargando...</div>

    <div class="grid" id="animeGrid"></div>
  </div>

  <div id="modal" class="modal-overlay" style="display: none;">
    <div class="modal-dialog">
      <button class="btn-close" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:4050';
    let currentStatus = 'all';
    let currentSearch = '';

    const searchInput = document.getElementById('searchInput');
    const animeGrid = document.getElementById('animeGrid');
    const summary = document.getElementById('summary');
    const apiStatus = document.getElementById('apiStatus');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');

    async function checkApi() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`);
        const stats = await res.json();
        apiStatus.innerHTML = `Micro-API Activa: <strong>${stats.animes.toLocaleString()}</strong> animes · <strong>${stats.episodes.toLocaleString()}</strong> caps`;
        apiStatus.style.borderColor = '#10b981';
      } catch {
        apiStatus.innerHTML = '⚠️ Micro-API no conectada. Inicia: <code>npm run serve:catalog</code>';
        apiStatus.style.borderColor = '#ef4444';
      }
    }

    async function loadAnimes() {
      summary.textContent = 'Buscando...';
      try {
        const q = new URLSearchParams({ search: currentSearch, status: currentStatus, limit: 36 });
        const res = await fetch(`${API_BASE}/api/catalog?` + q.toString());
        const data = await res.json();
        summary.textContent = `Mostrando ${data.items.length} de ${data.total.toLocaleString()} animes`;

        animeGrid.innerHTML = data.items.map(a => `
          <div class="card" onclick="openAnime('${a.slug}')">
            <div class="poster-wrap">
              <img src="${a.poster}" class="poster-img" loading="lazy" onerror="this.src='https://cdn.jkdesa.com/assets/images/animes/image/default.jpg'"/>
            </div>
            <div class="card-meta">
              <div class="card-title">${a.title}</div>
              <div class="card-sub">
                <span>${a.status_label}</span>
                <span>${a.episodes_total ? a.episodes_total + ' caps' : ''}</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        summary.textContent = 'Error conectando con la API local. Asegúrate de ejecutar: npm run serve:catalog';
      }
    }

    window.openAnime = async (slug) => {
      modal.style.display = 'flex';
      modalContent.innerHTML = '<div style="padding: 40px; text-align: center;">Cargando ficha...</div>';
      try {
        const res = await fetch(`${API_BASE}/api/anime/${slug}`);
        const a = await res.json();

        modalContent.innerHTML = `
          <div class="modal-hero">
            <img src="${a.poster}" class="modal-poster"/>
            <div>
              <h2>${a.title}</h2>
              <div style="font-size: 0.8rem; color: var(--primary); margin: 4px 0;">${a.type} · ${a.status_label} ${a.year ? '· ' + a.year : ''}</div>
              <p class="modal-synopsis">${a.synopsis}</p>
            </div>
          </div>
          <h4>Capítulos disponibles (${a.episodes.length})</h4>
          <div class="ep-picker">
            ${a.episodes.map(e => `
              <button class="ep-btn" onclick="selectEp('${a.slug}', ${e.number}, this)">Cap. ${e.number}</button>
            `).join('')}
          </div>
          <div id="playerBox" class="player-box" style="display: none;"></div>
        `;

        if (a.episodes.length > 0) {
          const firstBtn = modalContent.querySelector('.ep-btn');
          if (firstBtn) selectEp(a.slug, a.episodes[0].number, firstBtn);
        }
      } catch (err) {
        modalContent.innerHTML = `<div style="color: #ef4444;">${err.message}</div>`;
      }
    };

    window.selectEp = async (slug, epNum, btn) => {
      document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const box = document.getElementById('playerBox');
      box.style.display = 'block';
      box.innerHTML = `<div>Cargando servidores del Cap. ${epNum}...</div>`;

      try {
        const res = await fetch(`${API_BASE}/api/anime/${slug}/episodes/${epNum}/links`);
        const links = await res.json();
        const p = links.players[0];
        const pUrl = p ? (p.player_url || p.embed_url) : null;

        box.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <strong>Capítulo ${epNum}</strong>
            <span style="font-size: 0.8rem; color: var(--text-muted);">${links.players.length} reproductores · ${links.downloads.length} descargas</span>
          </div>

          ${pUrl ? `
            <div class="iframe-box">
              <iframe src="${pUrl}" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
            </div>
            <a href="${pUrl}" target="_blank" class="btn-cta">Abrir Reproductor Externo ↗</a>
          ` : '<p style="color: var(--text-muted);">Sin reproductor directo.</p>'}

          ${links.downloads.length > 0 ? `
            <div style="margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px;">
              <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Descargas Directas:</div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                ${links.downloads.map(d => `
                  <div style="display: flex; justify-content: space-between; background: var(--bg-surface); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem;">
                    <span>💾 <b>${d.server}</b> (${d.size || 'HD'})</span>
                    <a href="${d.download_url}" target="_blank" style="color: var(--primary); font-weight: 700;">Descargar ⤓</a>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        `;
      } catch (e) {
        box.innerHTML = `<div style="color: #ef4444;">Error al cargar enlaces del episodio.</div>`;
      }
    };

    window.closeModal = () => { modal.style.display = 'none'; };

    // Filtros
    document.querySelectorAll('.pill-btn').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.pill-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        currentStatus = b.dataset.status;
        loadAnimes();
      };
    });

    let deb;
    searchInput.oninput = (e) => {
      clearTimeout(deb);
      deb = setTimeout(() => {
        currentSearch = e.target.value.trim();
        loadAnimes();
      }, 300);
    };

    checkApi();
    loadAnimes();
  </script>
</body>
</html>
