<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>1UP Anime</title>
<script>
/* GitHub Pages SPA fallback (spa-github-pages pattern by rafgraph, MIT):
   GitHub Pages serves this file for any unknown path, e.g. a shared
   /anime/<id> detail link. It redirects into the app root with the path
   encoded in the query string (/?/anime/<id>); an inline script in
   index.html restores the real URL with history.replaceState before the
   app boots, so the detail page opens directly with zero setup.
   Project pages (user.github.io/<repo>/) keep 1 path segment; a custom
   domain or local root serving keeps 0. */
var pathSegmentsToKeep = /(^|\.)github\.io$/.test(window.location.hostname) ? 1 : 0;
var l = window.location;
l.replace(
  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
  l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
  l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
  l.hash
);
</script>
</head>
<body></body>
</html>
