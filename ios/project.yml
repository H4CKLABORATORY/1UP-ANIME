name: OneUpAnime
options:
  bundleIdPrefix: com.h4cklaboratory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  OneUpAnime:
    type: application
    platform: iOS
    sources:
      - path: OneUpAnime/Sources
      - path: OneUpAnime/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h4cklaboratory.oneupanime
        PRODUCT_NAME: OneUpAnime
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: OneUpAnime/Info.plist
      properties:
        CFBundleDisplayName: "1UP Anime"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Bangers-Regular.ttf
        ITSAppUsesNonExemptEncryption: false
