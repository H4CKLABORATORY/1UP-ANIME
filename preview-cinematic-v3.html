<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="description" content="1UP ANIME: vista de estudio de la identidad cinematográfica, con música original.">
<title>1UP ANIME | Estudio cinematográfico V3</title>
<link rel="icon" href="./assets/1up-anime-app-icon-512.png" type="image/png">
<link rel="stylesheet" href="./themes/cinematic-v3/studio.css">
<script defer src="./themes/cinematic-v3/studio.js"></script></head>
<body>
<main id="cinema" aria-label="Vista previa de animación cinematográfica de 1UP ANIME">
 <div class="environment">
  <div class="ambient ambient-blue"></div><div class="ambient ambient-red"></div>
  <div class="nebula nebula-a"></div><div class="nebula nebula-b"></div>
  <div class="energy-column energy-blue"></div><div class="energy-column energy-red"></div>
  <div class="ring ring-a"></div><div class="ring ring-b"></div>
  <div class="scene-fog scene-fog-blue"></div><div class="scene-fog scene-fog-red"></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="logo-group" id="brand-3d">
   <img class="logo-halo" src="./assets/oneup-header-letters.png" alt="" aria-hidden="true">
   <img class="logo-main" src="./assets/oneup-header-letters.png" alt="1UP ANIME">
   <div class="light-sweep" aria-hidden="true"></div>
  </div>
  <div class="optical-flash" aria-hidden="true"></div>
  <div class="letterbox-noise" aria-hidden="true"></div>
 </div>
 <video id="original-signature" preload="auto" playsinline src="./assets/1up-anime-intro-firma-3seg.mp4" tabindex="-1" aria-hidden="true"></video>
 <div class="preview-toolbar">
  <span class="stage-tag">VISTA DE ESTUDIO · COMPOSICIÓN V3</span>
  <span class="stage-desc">Audio original · 3,2 s · Capas independientes</span>
  <button type="button" id="replay" aria-label="Reproducir de nuevo la animación">↻ Reproducir</button>
  <a href="./" aria-label="Volver a 1UP ANIME">Volver a 1UP</a>
 </div>
 <p id="audio-status" class="sr-only" role="status" aria-live="polite"></p>
</main>
</body></html>
